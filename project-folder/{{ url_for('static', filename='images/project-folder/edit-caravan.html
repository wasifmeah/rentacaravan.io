<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Caravan | RentMyCaravan.io</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/edit-caravan.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">RentMyCaravan.io</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="listings.html">View Caravans</a>
            <a href="login.html">Login</a>
            <a href="register.html">Create Account</a>
        </div>
    </nav>

    <main class="form-container">
        <div class="form-card">
            <h2>Edit Caravan</h2>
            <form id="editCaravanForm" class="caravan-form">
                <div class="form-group">
                    <label for="title">Caravan Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" required>
                </div>
                <div class="form-group">
                    <label for="price">Price per Day (£)</label>
                    <input type="number" id="price" name="price" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="text" id="image" name="image">
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </div>
    </main>

    <section class="caravan-list"></section>

    <script>
        let caravans = JSON.parse(localStorage.getItem('caravans')) || [
            {
                id: 1,
                title: "Spacious 4-Berth with sea view",
                location: "Lake District",
                price: 85,
                image: "images/caravan1.jpg",
                description: "Perfect for family holidays"
            },
            {
                id: 2,
                title: "Modern Luxury Suite",
                location: "Yorkshire Dales",
                price: 130,
                image: "images/caravan2.jpg",
                description: "Luxury camping experience"
            }
        ];

        function renderCaravans() {
            const caravanList = document.querySelector('.caravan-list');
            caravanList.innerHTML = '';

            caravans.forEach(caravan => {
                const caravanCard = `
                    <div class="caravan-card" data-id="${caravan.id}">
                        <img src="${caravan.image}" alt="${caravan.title}">
                        <div class="caravan-info">
                            <h3>${caravan.title}</h3>
                            <p>Location: ${caravan.location}</p>
                            <p>Price: £${caravan.price}/day</p>
                            <p>${caravan.description}</p>
                        </div>
                        <div class="caravan-actions">
                            <button onclick="editCaravan(${caravan.id})" class="btn-secondary">Edit</button>
                            <button onclick="deleteCaravan(${caravan.id})" class="btn-danger">Delete</button>
                        </div>
                    </div>
                `;
                caravanList.innerHTML += caravanCard;
            });
        }

        function editCaravan(id) {
            window.location.href = `editcaravan.html?id=${id}`;
        }

        function deleteCaravan(id) {
            if (confirm('Are you sure you want to delete this caravan?')) {
                caravans = caravans.filter(caravan => caravan.id !== id);
                localStorage.setItem('caravans', JSON.stringify(caravans));
                renderCaravans();
            }
        }

        document.addEventListener('DOMContentLoaded', renderCaravans);
    </script>
</body>
</html>
